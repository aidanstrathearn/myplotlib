<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Myplotlib web embedding</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f4f4;
        color: #222;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 1500px;
        margin: 0 auto;
        padding: 1.5rem;
      }

      .page-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      .thread-control {
        margin-left: auto;
        font-size: 0.875rem;
      }

      .thread-control select {
        font: inherit;
      }

      .apps {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.5rem;
      }

      section {
        min-width: 0;
        overflow: hidden;
        border: 1px solid #d2d2d2;
        border-radius: 0.5rem;
        background: white;
      }

      h2 {
        margin: 0;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #d2d2d2;
        font-size: 1rem;
      }

      canvas {
        display: block;
        width: 100%;
        height: min(70vh, 650px);
      }

      #error {
        color: #a40000;
      }

      @media (max-width: 900px) {
        .apps {
          grid-template-columns: 1fr;
        }

        canvas {
          height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="page-header">
        <h1>Two independently mounted Myplotlib applications</h1>
        <label class="thread-control">
          Threads
          <select id="thread-count">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="4">4</option>
            <option value="8">8</option>
            <option value="12">12</option>
          </select>
        </label>
      </div>
      <div class="apps">
        <section>
          <h2>Instance one</h2>
          <canvas data-myplotlib-app></canvas>
        </section>
        <section>
          <h2>Instance two</h2>
          <canvas data-myplotlib-app2></canvas>
        </section>
      </div>
      <p id="error" role="alert"></p>
    </main>

    <script type="module">
      import { mount } from "./dist/app.js";
      const canvas1 = document.querySelector("[data-myplotlib-app]");
      const canvas2 = document.querySelector("[data-myplotlib-app2]");
      const allowedThreads = new Set(["1", "2", "4", "8", "12"]);
      const threadCount = document.querySelector("#thread-count");
      const requestedThreads = new URLSearchParams(location.search).get(
        "threads",
      );
      const availableThreads = Math.max(1, navigator.hardwareConcurrency ?? 4);
      const defaultThreads = [8, 4, 2, 1].find(
        (candidate) => candidate <= availableThreads,
      );
      const threads = allowedThreads.has(requestedThreads)
        ? Number(requestedThreads)
        : defaultThreads;

      threadCount.value = String(threads);
      threadCount.addEventListener("change", () => {
        const url = new URL(location.href);
        url.searchParams.set("threads", threadCount.value);
        location.replace(url);
      });

      try {
        await Promise.all([
          mount(canvas1, { threads }),
          mount(canvas2, { threads }),
        ]);
      } catch (error) {
        document.querySelector("#error").textContent = String(error);
        throw error;
      }
    </script>
  </body>
</html>
